name: Build Windows Release

# Builds the native Windows app (65% and 108-key keyboard variants), packs the installers and
# attaches everything to a draft GitHub Release when a v* tag is pushed.
#
# Asset names matter: the in-app updater of older releases picks `*-x64-setup.exe` for installed copies and
# `*-windows-x64.exe` for portable copies, and `108key` in the name for the 108-key build.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Read version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -match '^v' -and $env:GITHUB_REF_NAME.TrimStart('v') -ne $version) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Unit tests
        run: cargo test --release

      - name: Build (65% keyboard)
        run: cargo build --release

      - name: Build (108-key keyboard)
        run: cargo build --release --features layout-108 --target-dir target/108

      - name: Write the icon into both exes
        shell: pwsh
        run: |
          ./scripts/set-exe-icon.ps1 -ExePath target/release/KuroCat.exe
          ./scripts/set-exe-icon.ps1 -ExePath target/108/release/KuroCat.exe

      - name: MCP stdio smoke test
        shell: bash
        run: |
          response=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | timeout 10 ./target/release/KuroCat.exe --mcp | head -n 1)
          echo "$response"
          echo "$response" | grep -q '"protocolVersion"'

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
          }

      - name: Build installers and collect assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          makensis /DVERSION=$version "/DEXE_PATH=..\target\release\KuroCat.exe" "/DOUTPUT=..\dist\KuroCat-$version-x64-setup.exe" installer\kurocat.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed (65%)" }
          makensis /DVERSION=$version "/DEXE_PATH=..\target\108\release\KuroCat.exe" "/DOUTPUT=..\dist\KuroCat-$version-108key-x64-setup.exe" installer\kurocat.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed (108-key)" }
          Copy-Item target\release\KuroCat.exe "dist\KuroCat-$version-windows-x64.exe"
          Copy-Item target\108\release\KuroCat.exe "dist\KuroCat-$version-108key-windows-x64.exe"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kurocat-windows-x64
          path: dist/*

      - name: Publish assets to a draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
